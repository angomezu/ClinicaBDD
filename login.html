<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinica La Bendicion de Dios Inicio de Sesion</title>
    <link rel = "icon" href =
    <link rel = "icon" href = "images/bg_1.jpg" type = "image/x-icon">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" 
    integrity="sha384-9aIt2nRpC12Uk9gS9baDl411NQApFmC26EwAOH8WgZl5MYYxFfc+NcPb1dKGj7Sk" crossorigin="anonymous">
    <link rel="stylesheet" href="login-style.css">
    <script src="login.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
</head>
<body>
    <form action="" class="contianer">
        <div class="box">
            <div class="row">
                <div class="col-sm-5 col-xs-1 box1">
                    <div class="inline-text">
                        <h1>Iniciar Sesión</h1>
                        <p>Inicia sesion para ver tus citas programadas, 
                            seguimiento de consultas y más.
                        </p>
                    </div>
                </div>
                <div class="col-sm-5 col-xs-1 box-2">
                    <div class="user-id user-data">
                        <input type="email" name="" id="username" required=""/>
                        <label>Por favor Ingrese su correo o numero de telefono</label>
                    </div>
                    <div class="user-id user-data">
                        <input type="password" name="" id="password" required=""/>
                        <label>Por favor Ingrese su contraseña</label>
                    </div>
                    <div class="user-id">
                        <p>Al continuar, usted esta aceptando a los terminos, condiciones y politicas de Clinica La Bendicion de Dios.</p>
                    </div>
                    <span><a href="#">Olvide mi contraseña</span></a>
                    <div class="user-id button">
                        <input type="submit" name="" id="" value="Iniciar Sesion" onclick="validate()"/>
                    </div>
                    <div class="user-id">
                        <p>O también</p>
                    </div>
                    <div class="user-id button">
                        <input type="reset" name="" id="" value="Resetear Contraseña">
                    </div>
                    <div class="user-id">
                        <p class="footer"><a href="#">¿Aún no tienes una cuenta? Crea una cuenta</a></p>
                    </div>

                </div>
            </div>

        </div>


    </form>


</body>
</html>
